services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulsechat
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat
    ports: ["5432:5432"]
    volumes: [pulsechat_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U pulsechat -d pulsechat"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pulsechat_pg:
