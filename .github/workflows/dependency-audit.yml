name: Dependency Audit

on:
  push:
    branches: [chore/dependency-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and audit
        run: |
          npm install
          npm audit --audit-level=moderate
